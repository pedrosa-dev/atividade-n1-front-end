<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findex Local | Contato</title>
  <meta name="description" content="Entre em contato com a Findex Local.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a href="index.html" class="logo">Findex Local</a>

      <nav class="menu-principal">
        <ul class="lista-menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="secao topo-pagina">
      <div class="container container-pequeno">
        <p class="topo-pagina-etiqueta">Contato</p>
        <h1 class="topo-pagina-titulo">Fale com a Findex Local</h1>
        <p class="texto-secao">
          Preencha o formulário abaixo e apresente seu negócio.
        </p>
      </div>
    </section>

    <section class="secao">
      <div class="container container-pequeno">

        <form class="formulario-contato">

          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
          </div>

          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
          </div>

          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Fale um pouco sobre seu negócio..." required></textarea>
          </div>

          <button type="submit" class="botao botao-primario">Enviar mensagem</button>

        </form>

      </div>
    </section>

  </main>

  <footer class="rodape">
    <div class="container rodape-conteudo">
      <p><strong>Findex Local</strong></p>

      <ul class="menu-rodape">
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
